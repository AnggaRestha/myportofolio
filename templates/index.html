{% extends 'base.html' %}
{% load static %}

{% block content %}
<main>
    <!-- Section Profile / Hero -->
    <section class="hero" id="profile">
        <div class="container hero-grid">
            <div class="hero-identity">
                <p class="hero-kicker">Computer Science &middot; Universitas Indonesia</p>
                <h1>{{ name }}</h1>
            </div>
            <div class="hero-photo">
                <div class="photo-block"></div>
                <img class="avatar" src="{% static 'img/KingRestha.jpg' %}" alt="Photo of {{ name }}">
            </div>
            <div class="hero-details">
                <p class="bio">{{ bio }}</p>
                <dl class="meta-list">
                    <div class="meta-row">
                        <dt>NPM</dt>
                        <dd>{{ npm }}</dd>
                    </div>
                    <div class="meta-row">
                        <dt>Program</dt>
                        <dd>{{ study_program }}</dd>
                    </div>
                </dl>
                <div class="social-links">
                    <a href="http://github.com/AnggaRestha" class="social-link">GitHub</a>
                    <a href="https://www.linkedin.com/in/anggarestha/" class="social-link">LinkedIn</a>
                    <a href="https://www.instagram.com/whosrestha/" class="social-link">Instagram</a>
                </div>
            </div>
        </div>
    </section>
</main>
{% endblock content %}
