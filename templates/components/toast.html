{% load static %}

<style>
    
    #toast-component.toast-component {
        position: fixed !important;
        top: 20px !important;
        right: 20px !important;
        left: auto !important;
        bottom: auto !important;
        margin: 0 !important;
        padding: 1rem 1.25rem !important;
        border: 2px solid #000000 !important;
        border-radius: 6px !important;
        box-shadow: 4px 4px 0px #000000 !important;
        background-color: #ffffff !important;
        color: #111111 !important;
        z-index: 99999 !important;
        min-width: 260px !important;
        max-width: 380px !important;
    }

    
    #toast-component.toast-success {
        background-color: #4ade80 !important;
        color: #052e16 !important;
    }

        
    #toast-component.toast-error {
        background-color: #f87171 !important;
        color: #450a0a !important;
    }

    .toast-title {
        font-size: 1rem !important;
        font-weight: 700 !important;
        margin: 0 0 0.25rem 0 !important;
        font-family: 'Space Grotesk', sans-serif !important;
    }

    .toast-message {
        font-size: 0.85rem !important;
        margin: 0 !important;
        font-family: 'Space Grotesk', sans-serif !important;
        line-height: 1.3 !important;
    }
</style>

<div id="toast-component" class="toast-component toast-hidden" popover="manual">
    <div class="toast-content">
        <h3 id="toast-title" class="toast-title">Title</h3>
        <p id="toast-message" class="toast-message">Message</p>
    </div>
</div>

<script src="{% static 'js/toast.js' %}"></script>
